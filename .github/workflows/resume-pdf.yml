name: Publish resume PDF
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - resume.html
      - .github/workflows/resume-pdf.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF renderer
        run: pip install weasyprint
      - name: Generate PDF
        run: weasyprint resume.html Liani_Ovalles_Resume.pdf
      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Liani_Ovalles_Resume.pdf
          git diff --cached --quiet || (git commit -m "Publish downloadable resume PDF" && git push)
